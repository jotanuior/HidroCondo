services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hidrocondo}
      POSTGRES_USER: ${POSTGRES_USER:-hidrocondo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hidrocondo}
    volumes:
      - hidrocondo_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hidrocondo} -d ${POSTGRES_DB:-hidrocondo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://hidrocondo:hidrocondo@db:5432/hidrocondo}
      API_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      TELEMETRY_API_KEY: ${TELEMETRY_API_KEY:-dev-telemetry-key}
      SCAE_SYNC_API_KEY: ${SCAE_SYNC_API_KEY:-dev-scae-sync-key}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://hidrocondo.tecmen.com.br}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: "${MAIL_FROM:-HidroCondo <no-reply@localhost>}"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:80"
    depends_on:
      - api

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: ["internal-nginx"]
    ports:
      - "${PROXY_HOST_PORT:-80}:80"
    volumes:
      - ./deploy/nginx-internal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  hidrocondo_pgdata:
