name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build API
        id: api_build
        run: |
          set -o pipefail
          npm run build -w apps/api 2>&1 | tee api-build.log
      - name: Build Web
        if: success()
        run: |
          set -o pipefail
          npm run build -w apps/web 2>&1 | tee web-build.log
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            api-build.log
            web-build.log
          if-no-files-found: ignore
