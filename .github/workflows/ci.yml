name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hidrocondo
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: hidrocondo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hidrocondo -d hidrocondo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build API
        id: api_build
        run: |
          set -o pipefail
          npm run build -w apps/api 2>&1 | tee api-build.log
      - name: Test measurement integrity and account isolation
        run: npm test -w apps/api
        env:
          TEST_DATABASE_URL: postgres://hidrocondo:test-password@localhost:5432/hidrocondo_test
      - name: Build Web
        if: success()
        run: |
          set -o pipefail
          npm run build -w apps/web 2>&1 | tee web-build.log
      - name: Test operational screens
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui -w apps/web
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            api-build.log
            web-build.log
            apps/web/test-results/
          if-no-files-found: ignore
