<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />
    <title>HidroCondo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const explicit = params.get('v2');
      if (explicit === '1') localStorage.setItem('hidrocondo.frontend', 'v2');
      if (explicit === '0') localStorage.setItem('hidrocondo.frontend', 'v1');
      const useV2 = explicit === '1' || (!explicit && localStorage.getItem('hidrocondo.frontend') === 'v2');
      if (useV2) {
        await import('/src/v2.tsx');
      } else {
        await import('/src/main.tsx');
        const script = document.createElement('script');
        script.src = '/menu-extra.js';
        script.defer = true;
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
