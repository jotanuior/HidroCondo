<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Entrando no HidroCondo</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#0b1220;color:#e5eefb}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#17345a 0,#0b1220 52%)}
    main{width:min(92vw,440px);padding:32px;border-radius:20px;background:rgba(16,26,45,.94);box-shadow:0 24px 80px rgba(0,0,0,.35);text-align:center}
    h1{font-size:24px;margin:0 0 12px}p{opacity:.82;line-height:1.5}.error{color:#ffb4b4}.spinner{width:34px;height:34px;margin:18px auto;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <h1>HidroCondo</h1>
    <div class="spinner" id="spinner"></div>
    <p id="status">Conectando sua sessão do SCAE...</p>
  </main>
  <script>
    (() => {
      const SCAE_ORIGIN = 'https://scae.lentec.com.br';
      const status = document.getElementById('status');
      const spinner = document.getElementById('spinner');
      let completed = false;

      function fail(message) {
        status.textContent = message;
        status.className = 'error';
        spinner.style.display = 'none';
      }

      async function exchange(scaeToken) {
        if (completed) return;
        completed = true;
        try {
          const response = await fetch('/api/v1/auth/scae/exchange', {
            method: 'POST',
            headers: { authorization: `Bearer ${scaeToken}` }
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || 'Não foi possível autenticar com o SCAE.');
          localStorage.setItem('hidrocondo.session', JSON.stringify({ token: data.token, user: data.user }));
          localStorage.setItem('hidrocondo.frontend', 'v2');
          status.textContent = 'Sessão reconhecida. Abrindo o painel...';
          location.replace('/?v2=1');
        } catch (error) {
          completed = false;
          fail(error instanceof Error ? error.message : 'Falha ao entrar no HidroCondo.');
        }
      }

      addEventListener('message', event => {
        if (event.origin !== SCAE_ORIGIN) return;
        const data = event.data;
        if (!data || data.type !== 'SCAE_SSO_TOKEN' || typeof data.token !== 'string' || data.token.length < 20) return;
        void exchange(data.token);
      });

      if (!window.opener) {
        fail('Abra o HidroCondo pelo SCAE para entrar automaticamente.');
        return;
      }

      window.opener.postMessage({ type: 'HIDROCONDO_SSO_READY' }, SCAE_ORIGIN);
      setTimeout(() => {
        if (!completed) fail('Não recebemos sua sessão do SCAE. Tente abrir novamente pelo SCAE.');
      }, 12000);
    })();
  </script>
</body>
</html>
