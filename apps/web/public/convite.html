<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convite HidroCondo</title><style>body{font-family:Inter,Arial,sans-serif;background:#f5f8fb;margin:0;color:#17324d}.wrap{max-width:520px;margin:6vh auto;padding:20px}.card{background:white;border-radius:18px;padding:28px;box-shadow:0 12px 36px #0001}h1{margin:.2rem 0}p{line-height:1.5}.muted{color:#6b7d8f}.info{background:#eef7ff;padding:14px;border-radius:12px;margin:18px 0}label{display:block;margin:14px 0 6px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cdd8e3;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#1668dc;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#f3f5f7}.error{background:#fff0f0;color:#9b1c1c}</style></head><body><div class="wrap"><div class="card"><div class="muted">MONITORAMENTO INTELIGENTE DE ÁGUA</div><h1>HidroCondo</h1><p id="intro">Validando convite…</p><div id="info" class="info" hidden></div><form id="form" hidden><label>Nome completo</label><input id="name" required><label>E-mail</label><input id="email" type="email" required><label>Senha</label><input id="password" type="password" minlength="8" required><button type="submit">Aceitar convite</button></form><div id="msg" class="msg" hidden></div></div></div><script>const token=new URLSearchParams(location.search).get('token');const intro=document.getElementById('intro'),info=document.getElementById('info'),form=document.getElementById('form'),msg=document.getElementById('msg'),email=document.getElementById('email');async function load(){if(!token)return fail('Link de convite inválido.');const r=await fetch('/api/v1/convites/'+encodeURIComponent(token));const b=await r.json().catch(()=>({}));if(!r.ok)return fail(b.error||'Convite indisponível.');intro.textContent='Você recebeu acesso ao HidroCondo.';info.hidden=false;info.innerHTML='<strong>'+esc(b.condominium?.name||'Condomínio')+'</strong><br>'+(b.unit?esc(b.unit.building_name+' · Unidade '+b.unit.identifier):'Acesso ao condomínio')+'<br><span class="muted">Perfil: '+esc(b.role)+'</span>';if(b.invited_email){email.value=b.invited_email;email.readOnly=true}form.hidden=false}form.addEventListener('submit',async e=>{e.preventDefault();const body={name:document.getElementById('name').value,email:email.value,password:document.getElementById('password').value};const r=await fetch('/api/v1/convites/'+encodeURIComponent(token)+'/aceitar',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const b=await r.json().catch(()=>({}));if(!r.ok)return fail(b.error||'Não foi possível aceitar o convite.');localStorage.setItem('hidrocondo.session',JSON.stringify({token:b.token,user:b.user}));msg.hidden=false;msg.className='msg';msg.textContent='Acesso liberado. Redirecionando para o HidroCondo…';setTimeout(()=>location.href='/',900)});function fail(t){intro.textContent='Não foi possível usar este convite.';msg.hidden=false;msg.className='msg error';msg.textContent=t}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>
