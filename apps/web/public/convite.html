<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convite HidroCondo</title><style>:root{--p:#2563eb;--bg:#f5f7fb;--t:#101828;--m:#667085;--b:#e6eaf0}*{box-sizing:border-box}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);margin:0;color:var(--t);min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:white;border:1px solid var(--b);border-radius:18px;padding:28px;box-shadow:0 20px 60px #0f172a10}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:12px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800}.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:800;color:var(--p)}h1{margin:6px 0 18px;font-size:30px;letter-spacing:-.04em}p{line-height:1.5}.muted{color:var(--m);font-size:13px}.info{background:#eff6ff;border:1px solid #dbeafe;padding:14px;border-radius:11px;margin:18px 0;display:grid;gap:5px}.info span{font-size:12px;color:#667085}label{display:block;margin:14px 0 6px;font-weight:700;font-size:12px;color:#344054}input{width:100%;height:44px;padding:0 12px;border:1px solid #d9dee7;border-radius:9px;font:inherit}input:focus{outline:0;border-color:#9bb6fb;box-shadow:0 0 0 3px #2563eb12}button{width:100%;height:46px;border:0;border-radius:9px;background:var(--p);color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:18px}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#ecfdf3;color:#087f5b}.error{background:#fff1f2;color:#9f1239}.role{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eef4ff;color:#1d4ed8;font-size:10px;font-weight:800}</style></head><body><main class="card"><div class="brand"><div class="logo">HC</div><div><div class="eyebrow">MONITORAMENTO INTELIGENTE DE ÁGUA</div><strong>HidroCondo</strong></div></div><h1>Convite de acesso</h1><p id="intro" class="muted">Validando seu convite…</p><div id="info" class="info" hidden></div><form id="form" hidden><label>Nome completo<input id="name" autocomplete="name" required></label><label>E-mail<input id="email" type="email" autocomplete="email" required></label><label>Senha<input id="password" type="password" minlength="8" autocomplete="current-password" required></label><p class="muted">Se você já possui conta, informe a senha atual. Se ainda não possui, esta será sua senha de acesso.</p><button type="submit">Aceitar convite e entrar</button></form><div id="msg" class="msg" hidden></div></main><script>const token=new URLSearchParams(location.search).get('token');const intro=document.getElementById('intro'),info=document.getElementById('info'),form=document.getElementById('form'),msg=document.getElementById('msg'),email=document.getElementById('email');let mode='new';const roleName=r=>({admin:'Administrador',sindico:'Síndico',zelador:'Zelador',conselheiro:'Conselheiro',morador:'Morador'})[r]||r;const scopeName=s=>({account:'Conta completa',condominium:'Condomínio',building:'Bloco',unit:'Unidade',sensor:'Sensor'})[s]||s;async function load(){if(!token)return fail('Link de convite inválido.');let r=await fetch('/api/v1/compartilhamentos/'+encodeURIComponent(token)),b=await r.json().catch(()=>({}));if(r.status===404){r=await fetch('/api/v1/convites/'+encodeURIComponent(token));b=await r.json().catch(()=>({}));mode='legacy'}if(!r.ok)return fail(b.error||'Convite indisponível.');intro.textContent='Você recebeu acesso ao HidroCondo.';info.hidden=false;if(mode==='new'){const label=b.scope?.label||scopeName(b.scope_type);info.innerHTML='<strong>'+esc(label)+'</strong><span>'+esc(scopeName(b.scope_type))+'</span><div><span class="role">'+esc(roleName(b.role))+'</span></div>'}else{info.innerHTML='<strong>'+esc(b.condominium?.name||'Condomínio')+'</strong><span>'+(b.unit?esc(b.unit.building_name+' · Unidade '+b.unit.identifier):'Acesso ao condomínio')+'</span><div><span class="role">'+esc(roleName(b.role))+'</span></div>'}if(b.invited_email){email.value=b.invited_email;email.readOnly=true}form.hidden=false}form.addEventListener('submit',async e=>{e.preventDefault();const body={name:document.getElementById('name').value.trim(),email:email.value.trim(),password:document.getElementById('password').value};const base=mode==='new'?'/api/v1/compartilhamentos/':'/api/v1/convites/';const r=await fetch(base+encodeURIComponent(token)+'/aceitar',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const b=await r.json().catch(()=>({}));if(!r.ok)return fail(b.error||'Não foi possível aceitar o convite.');localStorage.setItem('hidrocondo.session',JSON.stringify({token:b.token,user:b.user}));localStorage.setItem('hidrocondo.frontend','v2');form.hidden=true;msg.hidden=false;msg.className='msg';msg.textContent='Acesso liberado. Abrindo o HidroCondo…';setTimeout(()=>location.href='/?v2=1',800)});function fail(t){intro.textContent='Não foi possível usar este convite.';msg.hidden=false;msg.className='msg error';msg.textContent=t}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>
