<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha · HidroCondo</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8fc;color:#0f172a;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0f172a12}.mark{width:46px;height:46px;border-radius:13px;background:#2563eb;color:white;display:grid;place-items:center;font-weight:900;margin-bottom:20px}h1{font-size:26px;margin:0 0 8px}p{color:#64748b;line-height:1.5}.field{margin-top:18px}label{font-size:13px;font-weight:700}input{width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #d7dee8;border-radius:10px;font:inherit}.btn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.back{display:block;text-align:center;margin-top:16px;color:#475569;text-decoration:none;font-weight:700;font-size:13px}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;background:#eff6ff;color:#1d4ed8;font-size:13px}</style></head><body><main class="card"><div class="mark">H</div><h1>Recuperar senha</h1><p>Informe seu e-mail. Se houver uma conta ativa, enviaremos um link para criar uma nova senha.</p><form id="f"><div class="field"><label>E-mail<input id="email" type="email" required autofocus></label></div><button class="btn">Enviar link de recuperação</button></form><div id="msg" class="msg"></div><a class="back" href="/">Voltar para o login</a></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button'),m=document.getElementById('msg');b.disabled=true;b.textContent='Enviando…';m.style.display='none';try{const r=await fetch('/api/v1/auth/forgot-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const j=await r.json().catch(()=>({}));m.style.display='block';m.textContent=r.ok?(j.message||'Confira seu e-mail.'):j.error||'Não foi possível enviar agora.'}finally{b.disabled=false;b.textContent='Enviar link de recuperação'}}</script></body></html>
