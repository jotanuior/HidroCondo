<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários · HidroCondo</title><style>:root{--p:#2563eb;--bg:#f7f9fc;--s:#fff;--b:#e5e7eb;--t:#0f172a;--m:#64748b;--g:#10b981;--r:#ef4444;--w:#f59e0b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t)}.shell{max-width:1440px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.title h1{margin:0;font-size:30px}.title p{margin:6px 0 0;color:var(--m)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--b);background:#fff;color:#334155;padding:10px 13px;border-radius:10px;font-weight:700;cursor:pointer}.btn.primary{background:var(--p);color:#fff;border-color:var(--p)}.btn.danger{color:#b91c1c}.panel{background:#fff;border:1px solid var(--b);border-radius:16px;overflow:hidden}.toolbar{padding:14px 16px;border-bottom:1px solid var(--b);display:flex;gap:10px}.toolbar input{max-width:420px;width:100%;padding:11px 12px;border:1px solid #d7dee8;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--m);text-align:left;background:#fbfcfe;padding:11px 16px}td{padding:14px 16px;border-top:1px solid #eef2f7;vertical-align:middle}.name{font-weight:800}.sub{font-size:12px;color:var(--m);margin-top:3px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.on{background:#ecfdf5;color:#047857}.off{background:#fef2f2;color:#b91c1c}.row-actions{display:flex;gap:6px;justify-content:flex-end}.icon{border:1px solid var(--b);background:#fff;padding:7px 9px;border-radius:8px;cursor:pointer}.modal-bg{position:fixed;inset:0;background:#0f172a66;display:none;place-items:center;padding:18px;z-index:50}.modal-bg.show{display:grid}.modal{width:min(620px,100%);background:#fff;border-radius:16px;box-shadow:0 30px 80px #0003}.mh{padding:18px 20px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center}.mh h2{margin:0;font-size:19px}.body{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:12px;font-weight:700;color:#334155}input,select{width:100%;margin-top:6px;padding:11px 12px;border:1px solid #d7dee8;border-radius:10px;background:#fff}.span{grid-column:1/-1}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--b);padding:12px;border-radius:10px}.checks label{font-weight:500}.checks input{width:auto;margin:0 6px 0 0}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.msg{margin:12px 0;padding:11px 13px;border-radius:10px;background:#eff6ff;color:#1d4ed8;display:none}.empty{padding:40px;text-align:center;color:var(--m)}@media(max-width:800px){.shell{padding:18px 12px}.top{align-items:flex-start;flex-direction:column}.panel{overflow:auto}.grid{grid-template-columns:1fr}.span{grid-column:auto}.checks{grid-template-columns:1fr}th:nth-child(4),td:nth-child(4){display:none}}</style></head><body><main class="shell"><div class="top"><div class="title"><h1>Usuários e acessos</h1><p>Gerencie contas, perfis, status e senhas.</p></div><div class="actions"><button class="btn" onclick="location.href='/'">Voltar</button><button class="btn primary" id="newBtn">Novo usuário</button></div></div><section class="panel"><div class="toolbar"><input id="search" placeholder="Buscar por nome, e-mail ou perfil"></div><div style="overflow:auto"><table><thead><tr><th>Usuário</th><th>Perfil</th><th>Condomínios</th><th>Status</th><th style="text-align:right">Ações</th></tr></thead><tbody id="tbody"></tbody></table></div><div id="empty" class="empty" hidden>Nenhum usuário encontrado.</div></section></main><div id="modal" class="modal-bg"><div class="modal"><div class="mh"><h2 id="mtitle">Novo usuário</h2><button class="icon" onclick="closeModal()">✕</button></div><div class="body"><div id="msg" class="msg"></div><form id="form"><div class="grid"><label>Nome<input id="name" required minlength="2"></label><label>E-mail<input id="email" type="email" required></label><label>Perfil<select id="role"></select></label><label id="passWrap">Senha inicial<input id="password" type="password" minlength="8"></label><label class="span">Condomínios<div id="condos" class="checks"></div></label></div><div class="foot"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div></div><div id="resetModal" class="modal-bg"><div class="modal" style="width:min(460px,100%)"><div class="mh"><h2>Definir nova senha</h2><button class="icon" onclick="closeReset()">✕</button></div><div class="body"><p class="sub" id="resetUser"></p><label>Nova senha<input id="resetPass" type="password" minlength="8"></label><div class="foot"><button class="btn" onclick="closeReset()">Cancelar</button><button class="btn primary" id="resetSave">Alterar senha</button></div></div></div></div><script>let s;try{s=JSON.parse(localStorage.getItem('hidrocondo.session')||'null')}catch{}if(!s?.token||!['superadmin','admin'].includes(s.user?.role))location.href='/';const H={'content-type':'application/json',authorization:'Bearer '+s.token};let users=[],condos=[],editing=null,resetting=null;const j=async(url,opt={})=>{const r=await fetch(url,{...opt,headers:{...H,...opt.headers}});if(r.status===204)return null;const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||'Erro '+r.status);return b};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function roles(){const list=s.user.role==='superadmin'?['admin','sindico','zelador','conselheiro']:['sindico','zelador','conselheiro'];document.getElementById('role').innerHTML=list.map(x=>`<option value="${x}">${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}function condoChecks(selected=[]){document.getElementById('condos').innerHTML=condos.map(c=>`<label><input type="checkbox" value="${c.id}" ${selected.includes(c.id)?'checked':''}>${esc(c.name)}</label>`).join('')||'<span class="sub">Nenhum condomínio disponível</span>'}function draw(){const q=document.getElementById('search').value.toLowerCase();const f=users.filter(u=>(u.name+' '+u.email+' '+u.role).toLowerCase().includes(q));document.getElementById('empty').hidden=!!f.length;document.getElementById('tbody').innerHTML=f.map(u=>`<tr><td><div class="name">${esc(u.name)}</div><div class="sub">${esc(u.email)}</div></td><td>${esc(u.role)}</td><td>${u.condominiums?.map(c=>esc(c.name)).join(', ')||'—'}</td><td><span class="badge ${u.active?'on':'off'}">${u.active?'Ativo':'Inativo'}</span></td><td><div class="row-actions">${u.role!=='morador'?`<button class="icon" title="Editar" onclick="editUser('${u.id}')">Editar</button>`:''}<button class="icon" title="Senha" onclick="resetUser('${u.id}')">Senha</button>${u.id!==s.user.id?`<button class="icon" onclick="toggleUser('${u.id}',${!u.active})">${u.active?'Desativar':'Ativar'}</button><button class="icon" style="color:#b91c1c" onclick="deleteUser('${u.id}')">Excluir</button>`:''}</div></td></tr>`).join('')}async function load(){[users,condos]=await Promise.all([j('/api/v1/usuarios'),j('/api/v1/condominios')]);roles();draw()}document.getElementById('search').oninput=draw;document.getElementById('newBtn').onclick=()=>{editing=null;document.getElementById('mtitle').textContent='Novo usuário';document.getElementById('form').reset();document.getElementById('passWrap').style.display='block';document.getElementById('password').required=true;roles();condoChecks([]);document.getElementById('modal').classList.add('show')};window.closeModal=()=>document.getElementById('modal').classList.remove('show');window.editUser=id=>{const u=users.find(x=>x.id===id);if(!u)return;editing=id;document.getElementById('mtitle').textContent='Editar usuário';document.getElementById('name').value=u.name;document.getElementById('email').value=u.email;roles();document.getElementById('role').value=u.role;document.getElementById('passWrap').style.display='none';document.getElementById('password').required=false;condoChecks((u.condominiums||[]).map(c=>c.id));document.getElementById('modal').classList.add('show')};document.getElementById('form').onsubmit=async e=>{e.preventDefault();const ids=[...document.querySelectorAll('#condos input:checked')].map(x=>x.value);const body={name:document.getElementById('name').value,email:document.getElementById('email').value,role:document.getElementById('role').value,active:true,condominium_ids:ids};if(!editing)body.password=document.getElementById('password').value;try{await j(editing?'/api/v1/usuarios/'+editing:'/api/v1/usuarios',{method:editing?'PUT':'POST',body:JSON.stringify(body)});closeModal();await load()}catch(e){const m=document.getElementById('msg');m.style.display='block';m.textContent=e.message}};window.toggleUser=async(id,active)=>{await j('/api/v1/usuarios/'+id+'/status',{method:'PATCH',body:JSON.stringify({active})});await load()};window.deleteUser=async id=>{if(!confirm('Excluir este usuário? Esta ação não pode ser desfeita.'))return;await j('/api/v1/usuarios/'+id,{method:'DELETE'});await load()};window.resetUser=id=>{const u=users.find(x=>x.id===id);resetting=id;document.getElementById('resetUser').textContent=u?u.name+' · '+u.email:'';document.getElementById('resetPass').value='';document.getElementById('resetModal').classList.add('show')};window.closeReset=()=>document.getElementById('resetModal').classList.remove('show');document.getElementById('resetSave').onclick=async()=>{const password=document.getElementById('resetPass').value;if(password.length<8)return alert('A senha deve ter no mínimo 8 caracteres.');await j('/api/v1/usuarios/'+resetting+'/reset-password',{method:'POST',body:JSON.stringify({password})});closeReset()};load().catch(e=>{document.getElementById('empty').hidden=false;document.getElementById('empty').textContent=e.message});</script></body></html>
