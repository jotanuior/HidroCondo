<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro · HidroCondo</title><link rel="stylesheet" href="/tecmen-v2.css"><style>body{margin:0;background:#f6f8fb;font-family:Inter,Arial,sans-serif;color:#142249}.wrap{max-width:1180px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #e7ebf2;border-radius:14px;padding:18px}.card h2{margin:0 0 14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cfd6e2;border-radius:8px}.btn{border:0;background:#142249;color:#fff;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.muted{color:#64748b;font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.pill{padding:3px 7px;border-radius:999px;background:#eef2ff;font-size:12px}.error{color:#b42318}.ok{color:#047857}@media(max-width:850px){.grid,.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">Financeiro</h1><div class="muted">Planos, clientes e cobranças Asaas</div></div><button class="btn" onclick="location.href='/?v2=1'">Voltar</button></div><div id="msg" class="muted"></div><div class="grid"><section class="card"><h2>Novo plano</h2><div class="row"><div class="field"><label>Nome</label><input id="p-name"></div><div class="field"><label>Valor padrão</label><input id="p-amount" type="number" step="0.01" value="99.90"></div></div><div class="row"><div class="field"><label>Tipo</label><select id="p-type"><option value="recurring">Recorrente</option><option value="single">Único</option></select></div><div class="field"><label>Ciclo</label><select id="p-cycle"><option>MONTHLY</option><option>YEARLY</option><option>QUARTERLY</option><option>SEMIANNUALLY</option><option>WEEKLY</option><option>BIWEEKLY</option><option>BIMONTHLY</option></select></div></div><div class="row"><div class="field"><label>Modo de cálculo</label><select id="p-mode"><option value="fixed">Valor fixo</option><option value="per_sensor">Base + por sensor</option><option value="tiered">Faixas</option></select></div><div class="field"><label>Valor base</label><input id="p-base" type="number" step="0.01" value="0"></div></div><div class="field"><label>Valor por sensor ativo</label><input id="p-sensor" type="number" step="0.01" value="0"></div><button class="btn" onclick="createPlan()">Criar plano</button></section><section class="card"><h2>Planos cadastrados</h2><div id="plans"></div></section></div><section class="card" style="margin-top:18px"><h2>Clientes</h2><div class="muted" style="margin-bottom:10px">Defina plano, vencimento, descontos ou cortesia. A geração da cobrança usa a quantidade atual de sensores ativos.</div><div id="accounts"></div></section><section class="card" style="margin-top:18px"><h2>Cobranças recentes</h2><div id="charges"></div></section></div><script>const session=()=>{try{return JSON.parse(localStorage.getItem('hidrocondo.session')||'null')}catch{return null}};const s=session();if(!s?.token||s?.user?.role!=='superadmin')location.href='/?v2=1';async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'content-type':'application/json',authorization:'Bearer '+s.token,...(opt.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||('Erro '+r.status));return b}function msg(t,ok=true){const e=document.getElementById('msg');e.className=ok?'ok':'error';e.textContent=t;setTimeout(()=>e.textContent='',5000)}let plans=[];async function load(){try{const [p,a,c]=await Promise.all([api('/api/v1/billing/plans'),api('/api/v1/billing/accounts'),api('/api/v1/billing/charges')]);plans=p;renderPlans(p);renderAccounts(a);renderCharges(c)}catch(e){msg(e.message,false)}}function renderPlans(rows){document.getElementById('plans').innerHTML=rows.length?'<table class="table"><tr><th>Plano</th><th>Valor</th><th>Tipo</th></tr>'+rows.map(x=>`<tr><td>${esc(x.name)}</td><td>R$ ${Number(x.amount).toFixed(2)}</td><td><span class="pill">${esc(x.charge_type)} ${x.cycle||''}</span></td></tr>`).join('')+'</table>':'Nenhum plano cadastrado.'}function renderAccounts(rows){document.getElementById('accounts').innerHTML='<table class="table"><tr><th>Cliente</th><th>Sensores</th><th>Plano</th><th>Venc.</th><th>Status</th><th>Ações</th></tr>'+rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.active_sensors}</td><td><select id="plan-${x.id}"><option value="">Sem plano</option>${plans.map(p=>`<option value="${p.id}" ${p.id===x.billing_plan_id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></td><td><input id="due-${x.id}" type="number" min="1" max="28" value="${x.billing_due_day||10}" style="width:60px"></td><td>${esc(x.billing_status||'')}</td><td><button class="btn" onclick="saveAccount('${x.id}')">Salvar</button> <button class="btn" onclick="generate('${x.id}')">Gerar cobrança</button></td></tr>`).join('')+'</table>'}function renderCharges(rows){document.getElementById('charges').innerHTML=rows.length?'<table class="table"><tr><th>Cliente</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr>'+rows.map(x=>`<tr><td>${esc(x.account_name)}</td><td>R$ ${Number(x.amount).toFixed(2)}</td><td>${x.due_date||''}</td><td>${esc(x.status)}</td></tr>`).join('')+'</table>':'Nenhuma cobrança registrada.'}async function createPlan(){try{const type=document.getElementById('p-type').value;await api('/api/v1/billing/plans',{method:'POST',body:JSON.stringify({name:val('p-name'),amount:Number(val('p-amount')),charge_type:type,cycle:type==='recurring'?val('p-cycle'):null,billing_mode:val('p-mode'),base_amount:Number(val('p-base')),per_sensor_amount:Number(val('p-sensor')),tiers:[],active:true})});msg('Plano criado');load()}catch(e){msg(e.message,false)}}async function saveAccount(id){try{await api(`/api/v1/billing/accounts/${id}/config`,{method:'PUT',body:JSON.stringify({billing_plan_id:document.getElementById('plan-'+id).value||null,billing_due_day:Number(document.getElementById('due-'+id).value)||null,billing_discount_type:null,billing_discount_value:null,billing_discount_until:null,billing_exempt_until:null})});msg('Configuração salva');load()}catch(e){msg(e.message,false)}}async function generate(id){try{await api(`/api/v1/billing/accounts/${id}/generate`,{method:'POST',body:JSON.stringify({billing_type:'UNDEFINED'})});msg('Cobrança enviada ao Asaas');load()}catch(e){msg(e.message,false)}}function val(id){return document.getElementById(id).value}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();</script></body></html>
