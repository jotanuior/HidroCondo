<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova senha · HidroCondo</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8fc;color:#0f172a;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0f172a12}.mark{width:46px;height:46px;border-radius:13px;background:#2563eb;color:white;display:grid;place-items:center;font-weight:900;margin-bottom:20px}h1{font-size:26px;margin:0 0 8px}p{color:#64748b;line-height:1.5}.field{margin-top:16px}label{font-size:13px;font-weight:700}input{width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #d7dee8;border-radius:10px;font:inherit}.btn{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;background:#eff6ff;color:#1d4ed8;font-size:13px}.back{display:block;text-align:center;margin-top:16px;color:#475569;text-decoration:none;font-weight:700;font-size:13px}</style></head><body><main class="card"><div class="mark">H</div><h1>Criar nova senha</h1><p>Defina uma nova senha para sua conta do HidroCondo.</p><form id="f"><div class="field"><label>Nova senha<input id="p1" type="password" minlength="8" required autofocus></label></div><div class="field"><label>Confirmar senha<input id="p2" type="password" minlength="8" required></label></div><button class="btn">Alterar senha</button></form><div id="msg" class="msg"></div><a id="back" class="back" href="/" hidden>Ir para o login</a></main><script>const token=new URLSearchParams(location.search).get('token');const msg=document.getElementById('msg');if(!token){msg.style.display='block';msg.textContent='Link inválido.';document.getElementById('f').style.display='none'}document.getElementById('f').onsubmit=async e=>{e.preventDefault();const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a!==b){msg.style.display='block';msg.textContent='As senhas não conferem.';return}const btn=e.currentTarget.querySelector('button');btn.disabled=true;btn.textContent='Salvando…';const r=await fetch('/api/v1/auth/reset-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:a})});const j=await r.json().catch(()=>({}));msg.style.display='block';msg.textContent=r.ok?'Senha alterada com sucesso.':j.error||'Não foi possível alterar a senha.';if(r.ok){e.currentTarget.style.display='none';document.getElementById('back').hidden=false}btn.disabled=false;btn.textContent='Alterar senha'}</script></body></html>
