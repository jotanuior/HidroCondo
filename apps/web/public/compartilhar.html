<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compartilhar acesso · HidroCondo</title><style>:root{--primary:#2563EB;--secondary:#3B82F6;--success:#10B981;--warning:#F59E0B;--danger:#EF4444;--bg:#f6f8fc;--text:#0f172a;--muted:#64748b;--border:#e5e7eb}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);margin:0;color:var(--text)}.wrap{max-width:940px;margin:28px auto;padding:20px}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:0 4px 14px #0f172a08;margin-bottom:16px}h1{margin:.2rem 0;font-size:30px;letter-spacing:-.03em}.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--primary)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{font-weight:650;font-size:13px;color:#334155}select,input{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #d9e0ea;border-radius:9px;background:white;color:var(--text)}select:focus,input:focus{outline:none;border-color:#93b4fd;box-shadow:0 0 0 3px #2563eb18}button,a.btn{padding:10px 14px;border:0;border-radius:9px;background:var(--primary);color:#fff;text-decoration:none;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px}.secondary{background:#fff!important;color:#334155!important;border:1px solid #d8dee8!important}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.muted{color:var(--muted)}.result{background:#eff6ff;border:1px solid #dbeafe;padding:14px;border-radius:10px;margin-top:16px;word-break:break-all}.context{display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid #eef2f7;border-radius:10px;padding:12px 14px;margin:14px 0}.context strong{display:block}.context span{display:block;font-size:12px;color:var(--muted);margin-top:2px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:12px;margin:12px auto}.card{padding:18px}}</style></head><body><div class="wrap"><div class="card"><div class="eyebrow">HIDROCONDO</div><h1>Compartilhar acesso</h1><p class="muted">Gere um convite seguro para morador, zelador, conselheiro ou síndico.</p><div id="context" class="context" hidden><div><strong id="contextTitle"></strong><span id="contextSub"></span></div></div></div><div class="card"><div class="grid"><label>Tipo de acesso<select id="scope"><option value="unit">Unidade / morador</option><option value="condominium">Condomínio / equipe</option></select></label><label id="roleWrap">Perfil<select id="role"><option value="morador">Morador</option></select></label><label id="condoWrap">Condomínio<select id="condo"></select></label><label id="unitWrap">Unidade<select id="unit"></select></label><label>E-mail específico (opcional)<input id="email" type="email" placeholder="morador@email.com"></label><label>Validade<select id="expires"><option value="24">24 horas</option><option value="72" selected>3 dias</option><option value="168">7 dias</option><option value="720">30 dias</option></select></label></div><div class="actions"><button id="generate">Gerar convite</button><a class="btn secondary" id="back" href="/">Voltar ao painel</a></div><div id="msg" class="result" hidden></div><div id="share" class="actions" hidden><a id="wa" class="btn" target="_blank">WhatsApp</a><a id="mail" class="btn secondary">E-mail</a><button id="copy" class="secondary">Copiar link</button></div></div></div><script>let session;try{session=JSON.parse(localStorage.getItem('hidrocondo.session')||'null')}catch{}if(!session?.token)location.href='/';const params=new URLSearchParams(location.search),presetType=params.get('scope_type'),presetId=params.get('scope_id'),v2=params.get('v2')==='1';if(v2)document.getElementById('back').href='/?v2=1';const H={'content-type':'application/json',authorization:'Bearer '+session.token};const scope=document.getElementById('scope'),role=document.getElementById('role'),condo=document.getElementById('condo'),unit=document.getElementById('unit'),unitWrap=document.getElementById('unitWrap');async function j(url,opt){const r=await fetch(url,{...opt,headers:{...H,...opt?.headers}});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||'Erro '+r.status);return b}function setMode(){const isUnit=scope.value==='unit';unitWrap.style.display=isUnit?'block':'none';condo.parentElement.style.display=isUnit?'none':'block';role.innerHTML=isUnit?'<option value="morador">Morador</option>':'<option value="zelador">Zelador</option><option value="conselheiro">Conselheiro</option><option value="sindico">Síndico</option>'}async function load(){const [cs,us]=await Promise.all([j('/api/v1/condominios'),j('/api/v1/unidades')]);condo.innerHTML=cs.map(c=>`<option value="${c.id}">${e(c.name)}</option>`).join('');unit.innerHTML=us.map(u=>`<option value="${u.id}">${e(u.condominium_name)} · ${e(u.building_name)} · ${e(u.identifier)}</option>`).join('');if(presetType==='unit'&&us.some(x=>x.id===presetId)){scope.value='unit';setMode();unit.value=presetId;const u=us.find(x=>x.id===presetId);showContext('Compartilhar unidade '+u.identifier,u.condominium_name+' · '+u.building_name+' · perfil Morador')}else if(presetType==='condominium'&&cs.some(x=>x.id===presetId)){scope.value='condominium';setMode();condo.value=presetId;const c=cs.find(x=>x.id===presetId);showContext('Compartilhar '+c.name,'Escolha o perfil que receberá acesso ao condomínio')}}function showContext(t,s){document.getElementById('context').hidden=false;document.getElementById('contextTitle').textContent=t;document.getElementById('contextSub').textContent=s}scope.addEventListener('change',()=>{setMode();document.getElementById('context').hidden=true});document.getElementById('generate').onclick=async()=>{const msg=document.getElementById('msg'),share=document.getElementById('share');try{const b=await j('/api/v1/convites',{method:'POST',body:JSON.stringify({scope_type:scope.value,scope_id:scope.value==='unit'?unit.value:condo.value,role:role.value,invited_email:document.getElementById('email').value||null,expires_hours:Number(document.getElementById('expires').value)})});msg.hidden=false;msg.innerHTML='<strong>Convite criado.</strong><br>'+e(b.url)+'<br><span class="muted">Expira em '+new Date(b.expires_at).toLocaleString('pt-BR')+'</span>';share.hidden=false;document.getElementById('wa').href='https://wa.me/?text='+encodeURIComponent(b.whatsapp_text);document.getElementById('mail').href='mailto:?subject='+encodeURIComponent(b.email_subject)+'&body='+encodeURIComponent(b.email_body);document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(b.url);document.getElementById('copy').textContent='Link copiado'}}catch(x){msg.hidden=false;msg.textContent=x.message}};function e(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}setMode();load().catch(x=>{const m=document.getElementById('msg');m.hidden=false;m.textContent=x.message});</script></body></html>
