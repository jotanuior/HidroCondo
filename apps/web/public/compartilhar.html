<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compartilhar acesso · HidroCondo</title><style>body{font-family:Inter,Arial,sans-serif;background:#f5f8fb;margin:0;color:#17324d}.wrap{max-width:900px;margin:32px auto;padding:20px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 12px 36px #0001;margin-bottom:18px}h1{margin:.2rem 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{font-weight:600;font-size:14px}select,input{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #cdd8e3;border-radius:10px;background:white}button,a.btn{padding:11px 14px;border:0;border-radius:10px;background:#1668dc;color:#fff;text-decoration:none;font-weight:700;cursor:pointer;display:inline-block}.secondary{background:#eaf1f8!important;color:#17324d!important}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.muted{color:#6b7d8f}.result{background:#eef7ff;padding:14px;border-radius:12px;margin-top:16px;word-break:break-all}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><div class="muted">HIDROCONDO</div><h1>Compartilhar acesso</h1><p>Gere um convite seguro para morador, zelador, conselheiro ou síndico.</p></div><div class="card"><div class="grid"><label>Tipo de acesso<select id="scope"><option value="unit">Unidade / morador</option><option value="condominium">Condomínio / equipe</option></select></label><label id="roleWrap">Perfil<select id="role"><option value="morador">Morador</option></select></label><label id="condoWrap">Condomínio<select id="condo"></select></label><label id="unitWrap">Unidade<select id="unit"></select></label><label>E-mail específico (opcional)<input id="email" type="email" placeholder="morador@email.com"></label><label>Validade<select id="expires"><option value="24">24 horas</option><option value="72" selected>3 dias</option><option value="168">7 dias</option><option value="720">30 dias</option></select></label></div><div class="actions"><button id="generate">Gerar convite</button><a class="btn secondary" href="/">Voltar ao painel</a></div><div id="msg" class="result" hidden></div><div id="share" class="actions" hidden><a id="wa" class="btn" target="_blank">WhatsApp</a><a id="mail" class="btn secondary">E-mail</a><button id="copy" class="secondary">Copiar link</button></div></div></div><script>let session;try{session=JSON.parse(localStorage.getItem('hidrocondo.session')||'null')}catch{}if(!session?.token)location.href='/';const H={'content-type':'application/json',authorization:'Bearer '+session.token};const scope=document.getElementById('scope'),role=document.getElementById('role'),condo=document.getElementById('condo'),unit=document.getElementById('unit'),unitWrap=document.getElementById('unitWrap');async function j(url,opt){const r=await fetch(url,{...opt,headers:{...H,...opt?.headers}});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||'Erro '+r.status);return b}async function load(){const [cs,us]=await Promise.all([j('/api/v1/condominios'),j('/api/v1/unidades')]);condo.innerHTML=cs.map(c=>`<option value="${c.id}">${e(c.name)}</option>`).join('');unit.innerHTML=us.map(u=>`<option value="${u.id}">${e(u.condominium_name)} · ${e(u.building_name)} · ${e(u.identifier)}</option>`).join('')}scope.addEventListener('change',()=>{const isUnit=scope.value==='unit';unitWrap.style.display=isUnit?'block':'none';condo.parentElement.style.display=isUnit?'none':'block';role.innerHTML=isUnit?'<option value="morador">Morador</option>':'<option value="zelador">Zelador</option><option value="conselheiro">Conselheiro</option><option value="sindico">Síndico</option>'});document.getElementById('generate').onclick=async()=>{const msg=document.getElementById('msg'),share=document.getElementById('share');try{const b=await j('/api/v1/convites',{method:'POST',body:JSON.stringify({scope_type:scope.value,scope_id:scope.value==='unit'?unit.value:condo.value,role:role.value,invited_email:document.getElementById('email').value||null,expires_hours:Number(document.getElementById('expires').value)})});msg.hidden=false;msg.innerHTML='<strong>Convite criado.</strong><br>'+e(b.url)+'<br><span class="muted">Expira em '+new Date(b.expires_at).toLocaleString('pt-BR')+'</span>';share.hidden=false;document.getElementById('wa').href='https://wa.me/?text='+encodeURIComponent(b.whatsapp_text);document.getElementById('mail').href='mailto:?subject='+encodeURIComponent(b.email_subject)+'&body='+encodeURIComponent(b.email_body);document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(b.url)}catch(x){msg.hidden=false;msg.textContent=x.message}};function e(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}scope.dispatchEvent(new Event('change'));load().catch(x=>{const m=document.getElementById('msg');m.hidden=false;m.textContent=x.message});</script></body></html>
